category: markets
indicators:
- key: gsec_10y_yield
  name: 10Y G-Sec Yield
  economic_meaning: Yield on the benchmark 10-year Government of India security -- the reference rate
    for domestic borrowing costs and a real-time fiscal/monetary-stance gauge.
  higher_is: neutral
  leading_lagging: leading
  report_section: Markets
  headline_weight: 0.7
  preferred_chart_window: 5y
  material_change_mom: 0.1
  material_change_yoy: 0.3
  material_change_ytd: 0.3
  status: registered_only
  source:
    organization:
      name: Reserve Bank of India (RBI)
      authority_level: official_primary
      description: Publishes government securities yield data via DBIE.
    dataset:
      authority_level: official_primary
      priority: 1
      access_method: html_table
      cadence: daily
      historical_start: 2000-01
      backfill_supported: true
      license_notes: Public data, RBI terms of use
    endpoints:
    - url: https://dbie.rbi.org.in
      access_method: html_table
      priority: 1
      authentication_type: none
      availability_status: unverified
    series:
    - series_key: gsec_10y_yield_in
      geography: IN
      unit: percent
      frequency: daily
      seasonal_adjustment: nsa
