<!-- The "signals"/"signals-light" themes' left icon rail — replaces
     _header.html's top nav for the main app (base.html includes this
     instead when g.theme is one of those two and the page hasn't opted out
     via {% block use_sidebar %}false{% endblock %},
     e.g. login.html/signup.html). Active/inactive coloring follows the same
     request.endpoint pattern _header.html's own nav links already use. -->
<aside class="signals-sidebar">
  <a class="signals-sidebar-brand" href="{{ url_for('home') }}" aria-label="Signals home">
    <svg width="24" height="19" viewBox="0 0 40 28" fill="none">
      <g fill="currentColor">
        <rect x="0" y="20" width="4" height="4"></rect><rect x="5" y="15" width="4" height="9"></rect>
        <rect x="10" y="9" width="4" height="15"></rect><rect x="15" y="4" width="4" height="20"></rect>
        <rect x="20" y="9" width="4" height="15"></rect><rect x="25" y="15" width="4" height="9"></rect>
        <rect x="30" y="20" width="4" height="4"></rect>
      </g>
      <path d="M2 20 C 10 20, 14 3, 20 3 C 26 3, 30 20, 38 20" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"></path>
    </svg>
  </a>

  <nav class="signals-sidebar-nav">
    <a class="signals-sidebar-link {{ 'is-active' if request.endpoint in ('research', 'research_thread') else '' }}" href="{{ url_for('research') }}">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <span>Research</span>
    </a>
    <a class="signals-sidebar-link {{ 'is-active' if request.endpoint in ('companies', 'company_report') else '' }}" href="{{ url_for('companies') }}">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="1"/><path d="M9 22v-4h6v4"/><path d="M8 6h.01M8 10h.01M8 14h.01M16 6h.01M16 10h.01M16 14h.01"/></svg>
      <span>Companies</span>
    </a>
    <a class="signals-sidebar-link {{ 'is-active' if request.endpoint == 'tools' else '' }}" href="{{ url_for('tools') }}">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="7" width="3" height="9"/><rect x="14" y="7" width="3" height="5"/><path d="M3 21h18"/></svg>
      <span>Tools</span>
    </a>
    <a class="signals-sidebar-link {{ 'is-active' if request.endpoint in ('investigations', 'investigate_view') else '' }}" href="{{ url_for('investigations') }}">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"/><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"/><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"/></svg>
      <span>Cases</span>
    </a>
    <a class="signals-sidebar-link {{ 'is-active' if request.endpoint == 'watchlist' else '' }}" href="{{ url_for('watchlist') }}">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
      <span>Watch</span>
    </a>
    <a class="signals-sidebar-link {{ 'is-active' if request.endpoint == 'docs' else '' }}" href="{{ url_for('docs') }}">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      <span>Docs</span>
    </a>
  </nav>

  {% if g.user and g.user['is_admin'] %}
  <a class="signals-sidebar-admin {{ 'is-active' if request.endpoint == 'settings' and request.args.get('panel', '').startswith('admin-') else '' }}" href="{{ url_for('settings', panel='admin-companies') }}" aria-label="Admin">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/></svg>
  </a>
  {% endif %}
</aside>
